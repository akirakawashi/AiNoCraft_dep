apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: databasus
  labels:
    app.kubernetes.io/name: databasus
    {{- include "platform.commonLabels" . | nindent 4 }}
spec:
  serviceName: databasus
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: databasus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: databasus
    spec:
      containers:
        - name: databasus
          image: {{ .Values.databasus.image | quote }}
          ports:
            - name: http
              containerPort: 4005
          envFrom:
            - secretRef:
                name: {{ .Values.databasus.secretName }}
          volumeMounts:
            - name: data
              mountPath: /databasus-data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.storageClassName | quote }}
        resources:
          requests:
            storage: {{ .Values.databasus.storage | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: databasus
  labels:
    app.kubernetes.io/name: databasus
    {{- include "platform.commonLabels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: databasus
  ports:
    - name: http
      port: 4005
      targetPort: http
