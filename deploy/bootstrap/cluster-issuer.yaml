# Let's Encrypt issuers for cert-manager. Traefik (k3s built-in) solves the
# HTTP-01 challenge via a temporary Ingress on ingressClassName: traefik.
#
# Prereqs: cert-manager installed (see ../../README.md §9), DNS pointing at the node,
# port 80 reachable. Fill in the ACME email below before applying.
#
# Use letsencrypt-staging while testing (high rate limits, untrusted cert), then
# switch app Ingress annotations to letsencrypt-prod once the flow works.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: skillet_skillet98@mail.ru
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: skillet_skillet98@mail.ru
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
