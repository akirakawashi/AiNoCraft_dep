{{- if .Values.s3Storage.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: s3-storage
  labels:
    app.kubernetes.io/name: s3-storage
    {{- include "platform.commonLabels" . | nindent 4 }}
  annotations:
    # cert-manager auto-issues and auto-renews the TLS cert into tlsSecretName.
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | quote }}
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - {{ .Values.s3Storage.ingress.host | quote }}
      secretName: {{ .Values.s3Storage.ingress.tlsSecretName | quote }}
  rules:
    - host: {{ .Values.s3Storage.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: s3-storage
                port:
                  number: 9000
{{- end }}
