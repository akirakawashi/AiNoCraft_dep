services:

  nginx:
    build: ./nginx
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/ainocraft-project/ssl:/etc/nginx/ssl:ro
    networks:
      - ainocraft_network

  databasus:
    container_name: databasus
    image: databasus/databasus:v3.7.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:4005:4005"
    env_file:
      - "/opt/ainocraft-project/.env"
    volumes:
      - databasus_data:/databasus-data
    networks:
      - ainocraft_network

  postgres:
    image: postgres:18.1-trixie
    container_name: postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - "/opt/ainocraft-project/.env"
    volumes:
      - pg_data:/var/lib/postgresql
    networks:
      - ainocraft_network

  redis:
    image: redis:8.4.0
    container_name: redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    env_file:
      - "/opt/ainocraft-project/.env"
    command: /bin/sh -c "redis-server --requirepass $$REDIS_PASSWORD"
    networks:
      - ainocraft_network

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    restart: unless-stopped
    volumes:
      - minio_data:/data
    env_file:
      - "/opt/ainocraft-project/.env"
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9001:9001"
      - "127.0.0.1:9000:9000"
    networks:
      - ainocraft_network

volumes:
  pg_data:
  redis_data:
  minio_data:
  databasus_data:


networks:
  ainocraft_network:
    name: ainocraft_network
    driver: bridge